          - "Thesis: TranSenA: A Transformer-based Framework for Sentiment Analysis of Restaurant Reviews"

    Experience:
      - company: Acote Group
        position: Software Engineer (Contractual)
        location: Dhaka, Bangladesh
        start_date: 2026-01
        end_date: 2026-05
        highlights:
          - Led the CUDA-based migration of a legacy DSP MRI image-reconstruction pipeline, re-engineering k-space-to-image conversion for parallel GPU execution.
          - Architected integration between an NVIDIA Jetson Xavier NX-based DPC Command Server and the MRI spectrometer controller for low-latency processing and real-time image rendering.

      - company: Frontier Semiconductor Metrology (FSM) Bangladesh Ltd.
        position: Software Engineer
        location: Dhaka, Bangladesh
        start_date: 2023-06
        end_date: present
        highlights:
          - Engineered CUDA C++ algorithms for wafer surface roughness computation, reducing processing time from 8 minutes to 9 seconds using White Light Interference technology and Basler machine-vision cameras.
          - Built computer vision and OCR-based wafer ID recognition systems for automated traceability across manufacturing pipelines.
          - Developed customized stress-measurement solutions for film-deposited wafers for Sony, Japan, using 650nm and 780nm laser metrology.

      - company: SELISE Digital Platforms
        position: Software Engineer Intern
        location: Dhaka, Bangladesh
        start_date: 2022-10
        end_date: 2022-11
        highlights:
          - Designed and developed a full-stack e-commerce platform using Angular, Node.js, and MongoDB.

    Research Experience:
      - company: CUET NLP Lab
        position: Research Assistant
        location: Chittagong, Bangladesh
        start_date: 2024-07
        end_date: present
        highlights:
          - Optimizing RAG-based LLM systems for faster, more secure inference over multimodal embeddings and vision-language models.
          - Investigating cross-modal gender bias in hate-speech classification to improve fairness and transparency in vision-language models.

    Projects:
      - name: Hardware-Accelerated Auto Focus
        summary: Designed a hardware-accelerated autofocus system for real-time image processing and focus optimization using NVIDIA Jetson Orin NX, CUDA C++, and a Basler camera.
        highlights:
          - Synchronized camera acquisition with motor-controller Z-axis traversal for automated focus sweeps.
          - Built a client-server architecture to coordinate autofocus commands from FSM's RAFT software with camera-motor operations.
          - Optimized CUDA C++ kernels with edge-based sharpness metrics for low-latency focal-position determination.
        start_date: 2026-01
        end_date: 2026-05

      - name: Wafer Surface Topography
        summary: CUDA C++ image processing for embedded high-performance systems.
        highlights:
          - Integrated high-speed machine-vision cameras for real-time, high-volume image processing on embedded HPC systems.
          - Parallelized image-processing routines using CUDA C++ and developed batch processing to resolve memory-overflow issues with high-resolution imagery.
        start_date: 2024-09
        end_date: present

      - name: GPU-Accelerated MRI Image Reconstruction
        summary: Migrating a legacy DSP-based MRI reconstruction pipeline to CUDA-based parallel processing for k-space-to-image conversion.
        highlights:
          - Integrating a Jetson Xavier NX DPC Command Server with the MRI spectrometer controller for real-time processing and image rendering.
        start_date: 2026-01
        end_date: 2026-05

      - name: RAG-Based LLM Chat Bot
        summary: Desktop application for document-grounded question answering using Retrieval-Augmented Generation and a large language model.
        highlights:
          - Added conversational memory for multi-turn sessions and PDF upload for document-grounded responses.
          - Ongoing optimization for faster, more secure response generation.
        start_date: 2025-07
        end_date: present

      - name: Wafer ID Detection
        summary: CNN-based pattern recognition for semi-font wafer IDs.
        highlights:
          - Captured real-time wafer images using a high-speed Basler machine-vision camera.
        start_date: 2024-02
        end_date: 2024-08

